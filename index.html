<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sidney Sebban — Full-Stack and Technical Solutions Engineer across IAM, cybersecurity, automation, and enterprise support."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sidney Sebban — Full-Stack, IAM & Technical Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so a light-theme visitor never sees
      // a dark flash. Key must match STORAGE_KEY in src/theme.ts.
      try {
        var stored = localStorage.getItem("portfolio-theme")
        document.documentElement.dataset.theme =
          stored === "light" ? "light" : "dark"
      } catch (error) {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
